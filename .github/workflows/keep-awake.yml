# Pings the roster server so it doesn't fall asleep and the first load stays fast.
# The ping is a CORS "OPTIONS" request: the server answers "ok" before the roster code check,
# so it needs no secret and never touches the database or the lesson plan sheet.
# To stop it: delete this file, or disable the workflow in GitHub > Actions.
name: Keep server awake

on:
  schedule:
    # Every 15 minutes, and only 07:00-23:00 Singapore time (UTC+8), which is
    # 23:00-15:00 UTC. Was every 5 minutes round the clock: ~8,600 runs a month
    # for a server two people use in office hours. GitHub runs scheduled jobs
    # late or skips them under load, so this was never really every 5 minutes
    # anyway - the function's own logs show whole hours with no ping at all.
    - cron: '*/15 23,0-15 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -X OPTIONS --max-time 30 https://kfqaaehcjqzfqxhmtskg.supabase.co/functions/v1/roster/
